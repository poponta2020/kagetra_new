<!-- @dsCard group="メール処理（A案: 縦フロー ③未選択＋大会紐付け・本文なし配信）" -->
<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../../design/colors_and_type.css">
<link rel="stylesheet" href="_form.css">
</head><body>

<div class="phone"><div class="main"><div class="page">

  <div class="crumb">← メール受信箱</div>

  <div class="card">
    <div class="mhead">
      <span class="mdate">2026/09/08 20:05</span>
      <span class="mpills"><span class="pill warn">未処理</span></span>
    </div>
    <div class="msubj">【第46回北海道大会】組合せ表送付（訂正版）</div>
    <div class="mfrom">北海道かるた協会 &lt;taikai@example.jp&gt;</div>
    <div class="matt"><a href="#">組合せ表_訂正版.pdf</a></div>
    <div class="mbody">先ほどお送りした組合せ表に誤りがありましたので、
訂正版を再送いたします。
お手数をおかけし申し訳ございません。</div>
  </div>

  <div class="card">
    <div class="h2">処理</div>

    <div class="sect"><span class="t">種別</span><span class="rule"></span></div>
    <div class="seg">
      <button class="on">未選択</button>
      <button>大会案内</button>
      <button>申込名簿</button>
      <button>確定名簿</button>
    </div>

    <div class="sect"><span class="t">対象の大会</span><span class="rule"></span></div>
    <div class="picked">
      <span class="pname">札幌AB
        <span class="pdate">2026-09-13〜2026-09-14 ・ 申込済み</span>
      </span>
      <a href="#" class="chg">変更</a>
    </div>

    <div class="sect"><span class="t">LINE 配信</span><span class="rule"></span></div>
    <label class="check">
      <span class="box on"></span>
      <span class="ctext">LINE で配信する
        <span class="csub">配信先: 札幌AB のグループ</span>
      </span>
    </label>
    <div class="nest">
      <label class="check">
        <span class="box"></span>
        <span class="ctext">メール本文を添付する
          <span class="csub">外すと、冒頭メッセージと添付ファイルのリンクだけを送ります</span>
        </span>
      </label>
      <div class="field">
        <div class="chips">
          <button class="chip">確定名簿が出ました！</button>
          <button class="chip">抽選結果が出ました！</button>
          <button class="chip">組合せ表です</button>
        </div>
        <textarea class="inp" rows="2" style="margin-top:6px">組合せ表の訂正版です</textarea>
      </div>
    </div>

    <button class="cta">実行する</button>
  </div>

  <button class="cta ghost" style="margin-top:0">対応不要</button>

</div></div></div>

</body></html>
