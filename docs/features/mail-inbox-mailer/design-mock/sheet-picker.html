<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../../design/colors_and_type.css">
<link rel="stylesheet" href="_form.css">
</head><body>

<div class="phone"><div class="sheetwrap">
  <div class="scrim"></div>
  <div class="sheet">
    <div class="h2">大会を選ぶ</div>
    <div class="hint" style="margin-top:2px">申込グループの単位です。2 日開催でも 1 行にまとまります。</div>

    <div class="field"><input class="inp ph" value="大会名で絞り込み"></div>

    <label class="check" style="margin-top:10px">
      <span class="box"></span>
      <span class="ctext" style="font-size:var(--kg-text-xs)">すべて表示
        <span class="csub">既定は「申込済み × 確定名簿が未取込」のグループだけ</span>
      </span>
    </label>

    <div class="cands">
      <label class="cand on">
        <span class="radio on"></span>
        <span class="cinfo">
          <span class="cname">札幌AB</span>
          <span class="cmeta">2026-09-13〜2026-09-14 ・ 申込済み ・ 確定名簿 未取込</span>
        </span>
      </label>
      <label class="cand">
        <span class="radio"></span>
        <span class="cinfo">
          <span class="cname">札幌CDE</span>
          <span class="cmeta">2026-09-13〜2026-09-14 ・ 申込済み ・ 確定名簿 未取込</span>
        </span>
      </label>
      <label class="cand">
        <span class="radio"></span>
        <span class="cinfo">
          <span class="cname">道南CDE</span>
          <span class="cmeta">2026-10-04 ・ 申込済み ・ 確定名簿 未取込</span>
        </span>
      </label>
      <label class="cand">
        <span class="radio"></span>
        <span class="cinfo">
          <span class="cname">みちのくAB</span>
          <span class="cmeta">2026-10-18 ・ 申込済み ・ 確定名簿 未取込</span>
        </span>
      </label>
    </div>

    <div class="rowbtn">
      <button class="cta ghost back">キャンセル</button>
      <button class="cta">決定</button>
    </div>
  </div>
</div></div>

</body></html>
