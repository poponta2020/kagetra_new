<!-- @dsCard group="申込書作成（S3: 設定ハブ・申込書設定）" -->
<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../../design/colors_and_type.css">
<style>
  /* entry-form-autofill S3 — 設定ハブ > 申込書設定。会の定数6項目の単純フォーム。
     既存 /settings 配下の流儀（Card で包まない・リスト/フォームの平組み）に合わせる。 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--kg-font-sans); display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 12px; background: var(--kg-surface-alt); }
  .phone { width: 375px; height: 812px; display: flex; flex-direction: column; background: var(--kg-bg); border: 1px solid var(--kg-border); border-radius: 14px; overflow: hidden; font-size: var(--kg-text-base); color: var(--kg-fg); line-height: var(--kg-leading-normal); box-shadow: var(--kg-shadow-md); }
  .main { flex: 1; min-height: 0; overflow-y: auto; }
  .page { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
  .crumb { font-size: 11px; color: var(--kg-fg-3); } .crumb b { color: var(--kg-fg-2); }
  h1 { font-family: var(--kg-font-display); font-weight: var(--kg-w-bold); font-size: 20px; line-height: 1.3; }
  .lead { font-size: 11px; color: var(--kg-fg-3); line-height: 1.6; }

  .form { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--kg-fg-3); }
  .in { font-size: 14px; padding: 9px 10px; background: var(--kg-surface); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-md); color: var(--kg-fg); font-family: var(--kg-font-sans); }
  .hint { font-size: 10px; color: var(--kg-fg-muted); }

  .foot { flex: none; padding: 10px 16px 14px; border-top: 1px solid var(--kg-border); background: var(--kg-surface); }
  .cta { display: block; width: 100%; text-align: center; padding: 12px 0; border: 0; border-radius: var(--kg-radius-md); background: var(--kg-brand); color: var(--kg-fg-on-brand); font-family: var(--kg-font-sans); font-size: var(--kg-text-base); font-weight: var(--kg-w-bold); }
</style></head><body>

<div class="phone"><div class="main"><div class="page">

  <div>
    <div class="crumb">設定 › <b>申込書設定</b></div>
    <h1>申込書設定</h1>
    <div class="lead">大会申込書のヘッダ欄とメール署名に使う会の情報です。責任者が交代したらここを更新します。</div>
  </div>

  <div class="form">
    <div class="field"><label>都道府県</label><input class="in" value="北海道"></div>
    <div class="field"><label>所属会名</label><input class="in" value="北海道大学かるた会"></div>
    <div class="field"><label>申込責任者氏名</label><input class="in" value="山田 太郎"><span class="hint">メール本文の署名（姓）にも使われます</span></div>
    <div class="field"><label>連絡先電話番号</label><input class="in" value="090-0000-0000"></div>
    <div class="field"><label>連絡先 E-Mail</label><input class="in" value="karuta-club@example.com"><span class="hint">下書きの差出人（From）になります</span></div>
    <div class="field"><label>振込名義人</label><input class="in" value="ﾎｯｶｲﾄﾞｳﾀﾞｲｶﾞｸｶﾙﾀｶｲ"><span class="hint">申込書に振込名義人欄がある場合に記入されます</span></div>
  </div>

</div></div>

<div class="foot">
  <button class="cta">保存</button>
</div>
</div>

</body></html>
