<!-- @dsCard group="申込書作成（B案 状態: 会員行の編集シート）" -->
<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../../design/colors_and_type.css">
<style>
  /* entry-form-autofill S2 — B案 ②の変化形: 行タップ → ボトムシートで編集。
     ふりがな未登録（松田 結菜）を補完する場面。かなは users にも保存される旨を明示。
     ボトムシートは createPortal(body) + svh の既存規約（feedback_bottom_sheet_url_bar_hidden）を
     productionize 時に踏襲する前提のモック。 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--kg-font-sans); display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 12px; background: var(--kg-surface-alt); }
  .phone { position: relative; width: 375px; height: 812px; display: flex; flex-direction: column; background: var(--kg-bg); border: 1px solid var(--kg-border); border-radius: 14px; overflow: hidden; font-size: var(--kg-text-base); color: var(--kg-fg); line-height: var(--kg-leading-normal); box-shadow: var(--kg-shadow-md); }
  .main { flex: 1; min-height: 0; overflow-y: auto; }
  .page { display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 8px; }
  .crumb { font-size: 11px; color: var(--kg-fg-3); } .crumb b { color: var(--kg-fg-2); }
  h1 { font-family: var(--kg-font-display); font-weight: var(--kg-w-bold); font-size: 20px; line-height: 1.3; }
  .mlist { list-style: none; }
  .mlist > li + li { border-top: 1px solid var(--kg-border-soft); }
  .mrow { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; font-size: 12px; }
  .grade { flex: none; width: 34px; font-family: var(--kg-font-display); font-weight: var(--kg-w-bold); color: var(--kg-brand-fg); }
  .mname { min-width: 0; flex: 1; }
  .mname b { font-weight: var(--kg-w-bold); }
  .kana { display: block; font-size: 10px; color: var(--kg-fg-3); line-height: 1.3; }
  .dan { flex: none; width: 34px; text-align: right; color: var(--kg-fg-2); }

  /* オーバーレイ + ボトムシート */
  .overlay { position: absolute; inset: 0; background: rgba(30,27,19,0.4); }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--kg-surface); border-radius: 14px 14px 0 0;
    padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: var(--kg-shadow-md);
  }
  .grip { width: 36px; height: 4px; border-radius: 9999px; background: var(--kg-border-strong); margin: 0 auto; }
  .shead { display: flex; align-items: baseline; gap: 8px; }
  .shead h2 { font-family: var(--kg-font-display); font-weight: var(--kg-w-bold); font-size: 16px; flex: 1; }
  .remove { font-size: 11px; color: var(--kg-danger-fg); text-decoration: none; }

  .warnline { display: flex; gap: 6px; padding: 7px 10px; border-radius: var(--kg-radius-md); background: var(--kg-warn-bg); font-size: 11px; color: var(--kg-warn-fg); line-height: 1.5; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--kg-fg-3); }
  .field label .req { color: var(--kg-accent); }
  .in { font-size: 14px; padding: 8px 10px; background: var(--kg-bg); border: 1px solid var(--kg-border); border-radius: var(--kg-radius-md); color: var(--kg-fg); font-family: var(--kg-font-sans); }
  .in.miss { border-color: var(--kg-accent); }
  .in.ph { color: var(--kg-fg-muted); }
  .selrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .note { font-size: 10px; color: var(--kg-fg-3); }
  .save { display: block; width: 100%; text-align: center; padding: 12px 0; border: 0; border-radius: var(--kg-radius-md); background: var(--kg-brand); color: var(--kg-fg-on-brand); font-family: var(--kg-font-sans); font-size: var(--kg-text-base); font-weight: var(--kg-w-bold); }
</style></head><body>

<div class="phone">
  <div class="main"><div class="page">
    <div>
      <div class="crumb">イベント詳細 › <b>進行管理</b></div>
      <h1>申込書を作成</h1>
    </div>
    <ul class="mlist">
      <li><div class="mrow"><span class="grade">B級</span><span class="mname"><b>藤井 陸</b><span class="kana">ふじい りく</span></span><span class="dan">3段</span></div></li>
      <li><div class="mrow"><span class="grade">B級</span><span class="mname"><b>松田 結菜</b><span class="kana">ふりがな未登録</span></span><span class="dan">3段</span></div></li>
      <li><div class="mrow"><span class="grade">B級</span><span class="mname"><b>山本 大和</b><span class="kana">やまもと やまと</span></span><span class="dan">3段</span></div></li>
      <li><div class="mrow"><span class="grade">B級</span><span class="mname"><b>渡辺 莉子</b><span class="kana">わたなべ りこ</span></span><span class="dan">3段</span></div></li>
    </ul>
  </div></div>

  <div class="overlay"></div>
  <div class="sheet">
    <div class="grip"></div>
    <div class="shead">
      <h2>松田 結菜</h2>
      <a class="remove" href="#">この会員を外す</a>
    </div>
    <div class="warnline"><span>⚠</span><span>ふりがなが未登録です。入力すると会員情報にも保存され、次回から自動で記入されます。</span></div>
    <div class="grid2">
      <div class="field"><label>姓</label><input class="in" value="松田"></div>
      <div class="field"><label>名</label><input class="in" value="結菜"></div>
      <div class="field"><label>ふりがな（姓）<span class="req">*</span></label><input class="in miss ph" placeholder="まつだ"></div>
      <div class="field"><label>ふりがな（名）<span class="req">*</span></label><input class="in miss ph" placeholder="ゆいな"></div>
    </div>
    <div class="selrow">
      <div class="field"><label>参加級</label><input class="in" value="B級"></div>
      <div class="field"><label>段位</label><input class="in" value="3段"></div>
      <div class="field"><label>出場回数</label><input class="in" value="0"></div>
    </div>
    <div class="field"><label>備考</label><input class="in ph" placeholder="（初段位申請中 など）"></div>
    <div class="note">参加級・段位・出場回数・備考の変更はこの申込書だけに反映されます（会員情報は変わりません）</div>
    <button class="save">保存</button>
  </div>
</div>

</body></html>
